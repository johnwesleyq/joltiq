name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
      redis: { image: "redis:7.4-alpine", ports: ["6379:6379"] }
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: pip install -r requirements.lock && pip install -e .
      - run: python -m playwright install --with-deps chromium
      - run: psql postgresql://postgres:postgres@localhost:5432/postgres -c "create database joltiq_test"
      - run: ruff check joltiq tests
      - run: mypy joltiq
      - run: pip-audit -r requirements.lock || true   # report-only; triage findings in SECURITY.md
      - run: pytest -q --junitxml=../../test-results/api.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: api-test-results, path: test-results }
  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  windows-agent:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults: { run: { working-directory: apps/windows-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - shell: pwsh
        run: ./scripts/tests/BuildGate.Tests.ps1
      - name: Validate Outlook and general computer-use acceptance contracts
        shell: powershell
        run: |
          ./scripts/test-on-windows.ps1 -ValidateHarness
          ./scripts/test-on-windows.ps1 -ValidateComputerUseHarness
      - name: Build previous internal package for upgrade and rollback checks
        shell: pwsh
        run: ./scripts/build.ps1 -Version 0.0.1 -Distribution Internal -SkipTests -OutputDirectory ./artifacts-previous
      - name: Build, test, validate harness, and package internal-only MSI
        shell: pwsh
        run: ./scripts/build.ps1 -Version 0.0.2 -Distribution Internal
      - name: Install, launch, repair, upgrade, rollback-check, and uninstall
        shell: pwsh
        run: |
          $current = @(Get-ChildItem ./artifacts -Filter *.msi)
          $previous = @(Get-ChildItem ./artifacts-previous -Filter *.msi)
          if ($current.Count -ne 1 -or $previous.Count -ne 1) { throw "Lifecycle test requires exactly one current and previous MSI." }
          ./scripts/test-on-windows.ps1 -InstallerLifecycle -Msi $current[0].FullName -PreviousMsi $previous[0].FullName -LifecycleEvidencePath ./artifacts/installer-lifecycle.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-agent-diagnostics-${{ github.run_id }}
          path: |
            apps/windows-agent/artifacts/logs/**
            apps/windows-agent/artifacts/*.trx
            apps/windows-agent/artifacts/installer-lifecycle.json
            apps/windows-agent/artifacts-previous/logs/**
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: joltiq-companion-INTERNAL-ONLY-${{ github.run_number }}
          path: |
            apps/windows-agent/artifacts/*.msi
            apps/windows-agent/artifacts/SHA256SUMS.txt
            apps/windows-agent/artifacts/build-manifest.json
            apps/windows-agent/artifacts/publish/tray/computer-use-capabilities.json
            apps/windows-agent/artifacts/INTERNAL-ONLY.txt
            apps/windows-agent/artifacts/installer-lifecycle.json
          if-no-files-found: error
          retention-days: 7
