[project]
name = "joltiq-mock-freshdesk"
version = "0.1.0"
description = "MOCK Freshdesk: an in-memory stand-in for the subset of the public Freshdesk REST API v2 that the JoltIQ ticketing adapter uses (tickets, contacts, notes, replies, agents/me, 429 rate limits, webhooks). DEV/TEST ONLY. Not Freshdesk and not affiliated with Freshworks."
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.3",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_freshdesk"]

