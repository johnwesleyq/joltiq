groups:
  - name: joltiq
    rules:
      - alert: ApiHighErrorRate
        expr: sum(rate(joltiq_http_requests_total{status=~"5.."}[5m])) / sum(rate(joltiq_http_requests_total[5m])) > 0.02
        for: 10m
        labels: { severity: page }
        annotations: { summary: "API 5xx rate above 2% for 10 minutes" }
      - alert: ApiLatencyP95High
        expr: histogram_quantile(0.95, sum by (le) (rate(joltiq_http_request_duration_ms_bucket[5m]))) > 2500
        for: 15m
        labels: { severity: ticket }
        annotations: { summary: "API p95 latency above 2.5s" }
      - alert: ApiDown
        expr: up{job="joltiq-api"} == 0
        for: 2m
        labels: { severity: page }
# Worker liveness, dead-lettered jobs and browser-worker health are exposed in Platform → Health
# (/api/v1/admin/platform/health); scrape it with a blackbox/json exporter or alert from your uptime monitor.
